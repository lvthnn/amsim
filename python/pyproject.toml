# python/pyproject.toml
[build-system]
requires = ["setuptools>=45", "wheel", "pybind11>=2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "amsimpy"
version = "0.1.0"
description = "Assortative mating simulations in Python"
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["amsim*"]
exclude = ["bindings*", "tests*"]

[tool.pyright]
venvPath = ".."
venv = ".venv"
