name: Release build routine

on:
  push:
    tags:
      - "v*"

env:
  BUILD_TYPE: Release

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install hdf5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev libopenblas-dev

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Package CLI binary
        run: tar -czf amsim-${{github.ref_name}}-${{matrix.name}}.tar.gz -C ${{github.workspace}}/build amsim

      - name: Upload CLI binary
        uses: softprops/action-gh-release@v3
        with:
          files: amsim-${{github.ref_name}}-${{matrix.name}}.tar.gz
